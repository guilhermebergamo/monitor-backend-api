name: Deploy to Azure - Production

# ⚠️ ATENÇÃO: Ambiente de produção ainda não foi criado
# Este workflow está preparado mas não funcionará até criar:
# - Resource Group: rg-monitor-prod
# - Container Apps Environment
# - Container App: monitor-api-prod
# - Service Principal para produção

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch: # Permite executar manualmente

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_CONTAINER_APP_NAME: 'monitor-api-prod' # Nome do seu Azure Container App de produção (CRIAR QUANDO NECESSÁRIO)
  RESOURCE_GROUP: 'rg-monitor-prod' # Resource group de produção (CRIAR QUANDO NECESSÁRIO)
  CONTAINER_REGISTRY: 'monitordevregistry.azurecr.io' # Azure Container Registry (mesmo registry)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production # Ambiente de proteção (pode requerer aprovação manual)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore MonitorBackend.sln
      
    - name: Build
      run: dotnet build MonitorBackend.sln --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test MonitorBackend.sln --no-build --verbosity normal --configuration Release
      # Em produção, falhar se os testes falharem
      
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}
        
    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}
        
    - name: Build and Push Docker Image
      run: |
        docker build -f Dockerfile.api -t ${{ env.CONTAINER_REGISTRY }}/monitor-api:${{ github.sha }} -t ${{ env.CONTAINER_REGISTRY }}/monitor-api:latest .
        docker push ${{ env.CONTAINER_REGISTRY }}/monitor-api:${{ github.sha }}
        docker push ${{ env.CONTAINER_REGISTRY }}/monitor-api:latest
        
    - name: Deploy to Azure Container App
      run: |
        az containerapp update \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.CONTAINER_REGISTRY }}/monitor-api:${{ github.sha }}
        
    - name: Logout from Azure
      run: az logout
      if: always()
      
    - name: Notify deployment
      if: success()
      run: echo "✅ Deploy para produção realizado com sucesso!"
