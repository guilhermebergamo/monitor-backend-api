name: Deploy to Azure - Production

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch: # Permite executar manualmente

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: 'monitor-api-prod' # Nome do seu Azure App Service/Container App para produção
  RESOURCE_GROUP: 'seu-resource-group-prod' # Seu resource group de produção

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: production # Ambiente de proteção (pode requerer aprovação manual)
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore MonitorBackend.sln
      
    - name: Build
      run: dotnet build MonitorBackend.sln --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test MonitorBackend.sln --no-build --verbosity normal --configuration Release
      # Em produção, falhar se os testes falharem
      
    - name: Publish
      run: dotnet publish src/01-API/MonitorBackend.Api/MonitorBackend.Api.csproj --configuration Release --output ./publish --no-build
      
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}
        
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./publish
        
    - name: Logout from Azure
      run: az logout
      if: always()
      
    - name: Notify deployment
      if: success()
      run: echo "✅ Deploy para produção realizado com sucesso!"
