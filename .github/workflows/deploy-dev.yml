name: Deploy to Azure - Development

on:
  push:
    branches:
      - develop
  workflow_dispatch: # Permite executar manualmente

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_CONTAINER_APP_NAME: 'monitor-api-dev' # Nome do seu Azure Container App
  RESOURCE_GROUP: 'rg-monitor-dev' # Resource group de desenvolvimento
  CONTAINER_REGISTRY: 'seu-registry.azurecr.io' # Seu Azure Container Registry

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        
    - name: Restore dependencies
      run: dotnet restore MonitorBackend.sln
      
    - name: Build
      run: dotnet build MonitorBackend.sln --configuration Release --no-restore
      
    - name: Run tests
      run: dotnet test MonitorBackend.sln --no-build --verbosity normal --configuration Release
      continue-on-error: true # Continue mesmo se não houver testes
      
    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS_DEV }}
        
    - name: Login to Azure Container Registry
      run: |
        az acr login --name ${{ secrets.ACR_NAME }}
        
    - name: Build and Push Docker Image
      run: |
        docker build -f Dockerfile.api -t ${{ env.CONTAINER_REGISTRY }}/monitor-api:${{ github.sha }} -t ${{ env.CONTAINER_REGISTRY }}/monitor-api:latest .
        docker push ${{ env.CONTAINER_REGISTRY }}/monitor-api:${{ github.sha }}
        docker push ${{ env.CONTAINER_REGISTRY }}/monitor-api:latest
        
    - name: Deploy to Azure Container App
      run: |
        az containerapp update \
          --name ${{ env.AZURE_CONTAINER_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --image ${{ env.CONTAINER_REGISTRY }}/monitor-api:${{ github.sha }}
        
    - name: Logout from Azure
      run: az logout
      if: always()
